name: ARP detector tests

on:
  push:
    paths:
      - "projects/arp-detector/**"
      - ".github/workflows/arp-tests.yml"
  pull_request:
    paths:
      - "projects/arp-detector/**"
      - ".github/workflows/arp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: projects/arp-detector
        run: python -m unittest discover -s tests -v
