name: Cybersecurity analytics checks

on:
  push:
    paths:
      - "projects/cybersecurity-data-analytics/**"
      - ".github/workflows/analytics-tests.yml"
  pull_request:
    paths:
      - "projects/cybersecurity-data-analytics/**"
      - ".github/workflows/analytics-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: projects/cybersecurity-data-analytics/requirements.txt
      - name: Install analytics requirements
        run: python -m pip install -r projects/cybersecurity-data-analytics/requirements.txt
      - name: Run unit tests with synthetic fixtures
        working-directory: projects/cybersecurity-data-analytics
        run: python -m unittest discover -s tests -v
      - name: Recreate sector charts from figure-transcribed example
        working-directory: projects/cybersecurity-data-analytics
        run: |
          python analytics.py sectors examples/sector-counts-transcribed-from-figure.csv --out charts/sector
          test -s charts/sector/sectors-grouped.png
          test -s charts/sector/sectors-stacked.png
