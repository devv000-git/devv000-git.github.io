<text x="38" y="85" fill="#eef7f5" font-size="22" font-weight="700">Recorded attack volume</text>
<text x="38" y="110" fill="#a4bbc4" font-size="13">Rounded percentages transcribed from SIT384 PDF page 54</text>
<circle cx="240" cy="238" r="120" fill="none" stroke="#64dbc0" stroke-width="64" stroke-dasharray="148.386 605.596" stroke-dashoffset="0.000" transform="rotate(-90 240 238)"><title>dos: 19.7%</title></circle>
<circle cx="240" cy="238" r="120" fill="none" stroke="#e9b878" stroke-width="64" stroke-dasharray="250.825 503.157" stroke-dashoffset="-148.386" transform="rotate(-90 240 238)"><title>u2r: 33.3%</title></circle>
<circle cx="240" cy="238" r="120" fill="none" stroke="#879ce7" stroke-width="64" stroke-dasharray="242.540 511.442" stroke-dashoffset="-399.211" transform="rotate(-90 240 238)"><title>r2l: 32.2%</title></circle>
<circle cx="240" cy="238" r="120" fill="none" stroke="#a9b2be" stroke-width="64" stroke-dasharray="112.231 641.751" stroke-dashoffset="-641.751" transform="rotate(-90 240 238)"><title>probe: 14.9%</title></circle>
<circle cx="240" cy="238" r="74" fill="#0d2130"/>
