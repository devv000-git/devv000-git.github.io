<rect x="495" y="170" width="14" height="14" rx="2" fill="#64dbc0"/><text x="522" y="182" fill="#d1e1e1" font-size="16">dos</text><text x="670" y="182" text-anchor="end" fill="#f4f8f6" font-size="17" font-weight="700">19.7%</text>
<rect x="495" y="219" width="14" height="14" rx="2" fill="#e9b878"/><text x="522" y="231" fill="#d1e1e1" font-size="16">u2r</text><text x="670" y="231" text-anchor="end" fill="#f4f8f6" font-size="17" font-weight="700">33.3%</text>
<rect x="495" y="268" width="14" height="14" rx="2" fill="#879ce7"/><text x="522" y="280" fill="#d1e1e1" font-size="16">r2l</text><text x="670" y="280" text-anchor="end" fill="#f4f8f6" font-size="17" font-weight="700">32.2%</text>
<rect x="495" y="317" width="14" height="14" rx="2" fill="#a9b2be"/><text x="522" y="329" fill="#d1e1e1" font-size="16">probe</text><text x="670" y="329" text-anchor="end" fill="#f4f8f6" font-size="17" font-weight="700">14.9%</text>
<text x="38" y="413" fill="#95acb4" font-size="12">Totals round to 100.1%; this is not the count of attack types.</text>
