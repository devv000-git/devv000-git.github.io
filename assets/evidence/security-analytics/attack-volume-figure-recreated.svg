<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Share of recorded attack volume by category</title>
<desc id="desc">Recreated from SIT384 PDF p. 54. Reported shares: dos 19.7 percent, u2r 33.3 percent, r2l 32.2 percent, probe 14.9 percent. Slices normalised because individually rounded values sum to 100.1 percent.</desc>
<rect width="720" height="440" fill="#0d2130" rx="14"/>
